swagger: "2.0"

info:
  title: FloraMatch API
  version: 1.0.0

schemes:
  - https

produces:
  - application/json

securityDefinitions:
  api_key:
    type: apiKey
    name: key
    in: query

security:
  - api_key: []

paths:

  /recommendations:
    post:
      operationId: getRecommendations
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/plant-recommendation-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK

  /garden/plants:
    get:
      operationId: getPlants
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/garden-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK

    post:
      operationId: addPlant
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/garden-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK

  /garden/plants/{id}:
    get:
      operationId: getPlantById
      parameters:
        - name: id
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/garden-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK

    put:
      operationId: updatePlant
      parameters:
        - name: id
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/garden-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK

    delete:
      operationId: deletePlant
      parameters:
        - name: id
          in: path
          required: true
          type: string
      x-google-backend:
        address: https://europe-central2-floramatch-497314.cloudfunctions.net/garden-service
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK